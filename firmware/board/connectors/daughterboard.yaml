# Daughterboard headers J1 (top edge: power and outputs) and J2 (bottom edge: inputs).
# Which harness pin each signal reaches depends on the motherboard: see motherboards/<years>/README.md.
# Must match scripts/design.py; firmware/tools/check_pins.py cross-checks the two.
pins:
  - pin: J1-6
    id: C14
    class: outputs
    function: "Fuel pump relay (ULN2003 low side)"
    ts_name: "FP - fuel pump relay"
    type: ls

  - pin: J1-7
    id: C13
    class: outputs
    function: "NB2 2003-05 main relay; NB1 VICS solenoid (ULN2003)"
    ts_name: "MAINRLY - main relay / VICS"
    type: ls

  - pin: J1-8
    id: E6
    class: outputs
    function: "A/C compressor relay (ULN2003)"
    ts_name: "AC - A/C relay"
    type: ls

  - pin: J1-9
    id: E5
    class: outputs
    function: "Radiator fan relay (ULN2003)"
    ts_name: "FAN - radiator fan relay"
    type: ls

  - pin: J1-10
    id: E4
    class: outputs
    function: "Check engine lamp (ULN2003)"
    ts_name: "CEL - check engine lamp"
    type: ls

  - pin: J1-11
    id: E3
    class: outputs
    function: "Tachometer (ULN2003)"
    ts_name: "TACH - tachometer"
    type: ls

  - pin: J1-12
    id: E2
    class: outputs
    function: "Condenser / second fan relay (ULN2003)"
    ts_name: "LS7 - second fan relay"
    type: ls

  - pin: J1-14
    id: E1
    class: outputs
    function: "Igniter 1 (coil pack 1&4), 5 V push-pull"
    ts_name: "IGN1 - coil 1&4"
    type: ign

  - pin: J1-15
    id: E0
    class: outputs
    function: "Igniter 2 (coil pack 2&3), 5 V push-pull"
    ts_name: "IGN2 - coil 2&3"
    type: ign

  - pin: J1-16
    id: B9
    class: outputs
    function: "Spare ignition (COP conversion), 5 V push-pull"
    ts_name: "IGN3 - spare coil"
    type: ign

  - pin: J1-17
    id: B8
    class: outputs
    function: "Spare ignition (COP conversion), 5 V push-pull"
    ts_name: "IGN4 - spare coil"
    type: ign

  - pin: J1-19
    id: B7
    class: outputs
    function: "Injector 1 (1989-95: batch group 1)"
    ts_name: "INJ1 - injector 1"
    type: inj

  - pin: J1-22
    id: B6
    class: outputs
    function: "Injector 2 (1989-95: batch group 2)"
    ts_name: "INJ2 - injector 2"
    type: inj

  - pin: J1-25
    id: B5
    class: outputs
    function: "Injector 3"
    ts_name: "INJ3 - injector 3"
    type: inj

  - pin: J1-28
    id: B4
    class: outputs
    function: "Injector 4"
    ts_name: "INJ4 - injector 4"
    type: inj

  - pin: J1-31
    id: B3
    class: outputs
    function: "Idle air control valve"
    ts_name: "IACV - idle valve"
    type: ls

  - pin: J1-34
    id: D7
    class: outputs
    function: "NB2 VVT oil control valve; 1996-97 and NB1 front O2 heater; 1989-93 purge"
    ts_name: "VVT - VVT / O2 heater"
    type: ls

  - pin: J1-37
    id: D6
    class: outputs
    function: "Boost control / spare low side (AUX header)"
    ts_name: "BOOST - aux low side"
    type: ls

  - pin: J1-40
    id: D5
    class: outputs
    function: "NB alternator field; 1994-95 pressure regulator solenoid"
    ts_name: "ALT - alternator field"
    type: ls

  - pin: J2-3
    id: EFI_ADC_3
    class: analog_inputs
    function: "Knock sensor (NB)"
    ts_name: "KNOCK - knock sensor"
    type: av

  - pin: J2-4
    id: EFI_ADC_4
    class: analog_inputs
    function: "Throttle position sensor"
    ts_name: "TPS - throttle position"
    type: av

  - pin: J2-5
    id: EFI_ADC_5
    class: analog_inputs
    function: "On-board MAP sensor (MPX5700AP)"
    ts_name: "MAP - on-board MPX5700AP"
    type: av

  - pin: J2-6
    id: EFI_ADC_6
    class: analog_inputs
    function: "Coolant temperature (2.7k pull-up)"
    ts_name: "CLT - coolant temperature"
    type: at

  - pin: J2-7
    id: EFI_ADC_7
    class: analog_inputs
    function: "Intake air temperature (2.7k pull-up), source picked by JP1"
    ts_name: "IAT - air temperature (JP1)"
    type: at

  - pin: J2-8
    id: EFI_ADC_14
    class: analog_inputs
    function: "External 0-5 V wideband input"
    ts_name: "AFR - external 0-5 V wideband"
    type: av

  - pin: J2-9
    id: EFI_ADC_15
    class: analog_inputs
    function: "Spare analog: rear HO2S (1996-2005), idle switch or electrical load (1989-95)"
    ts_name: "AUX1 - rear O2 / idle switch"
    type: av

  - pin: J2-10
    id: EFI_ADC_8
    class: analog_inputs
    function: "Spare analog: front narrowband O2"
    ts_name: "AUX2 - front O2"
    type: av

  - pin: J2-11
    id: EFI_ADC_9
    class: analog_inputs
    function: "Air flow meter / MAF signal"
    ts_name: "AUX3 - AFM / MAF"
    type: av

  - pin: J2-13
    id: [E7, E7]
    class: [event_inputs, switch_inputs]
    function: "Crank: CAS SGT (NA) or CKP (NB), hall / open collector"
    ts_name: "HALL1 - crank"
    type: hall

  - pin: J2-14
    id: [E8, E8]
    class: [event_inputs, switch_inputs]
    function: "Cam: CAS SGC (NA) or CMP (NB), hall / open collector"
    ts_name: "HALL2 - cam"
    type: hall

  - pin: J2-15
    id: [E9, E9]
    class: [event_inputs, switch_inputs]
    function: "12 V digital input: vehicle speed"
    ts_name: "SW1 - vehicle speed"
    type: din

  - pin: J2-16
    id: E10
    class: switch_inputs
    function: "12 V digital input: A/C switch"
    ts_name: "SW2 - A/C switch"
    type: din

  - pin: J2-17
    id: E11
    class: switch_inputs
    function: "12 V digital input: clutch switch"
    ts_name: "SW3 - clutch switch"
    type: din

  - pin: J2-21
    id: [E13, E13]
    class: [event_inputs, switch_inputs]
    function: "Spare VR input 1 (MAX9926)"
    ts_name: "VR1 - spare VR"
    type: vr

  - pin: J2-20
    id: [E12, E12]
    class: [event_inputs, switch_inputs]
    function: "Spare VR input 2 (MAX9926)"
    ts_name: "VR2 - spare VR"
    type: vr

  - id: EFI_ADC_1
    class: analog_inputs
    function: "Battery voltage (33k/6.8k)"
    ts_name: "VBATT - battery sense"

  - id: EFI_ADC_2
    class: analog_inputs
    function: "Ignition switch voltage (33k/6.8k)"
    ts_name: "VIGN - ignition sense"

info:
  cid: daughterboard
  title: miata-ecus daughterboard (rev 0.4)
  directory: miata-ecu
