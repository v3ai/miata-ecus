# Builds the rusEFI firmware for the miata-ecus board with rusEFI's own custom-board action.
# rusEFI is the firmware/ext/rusefi submodule, pinned to a tested commit.
name: Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yaml'
      - '.gitmodules'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yaml'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # rusEFI itself; the action fetches rusEFI's own submodules

      - name: Check the pin map against the board design
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          python3 firmware/tools/check_pins.py

      - name: Build firmware
        uses: ./firmware/ext/rusefi/.github/workflows/custom-board-build
        with:
          rusefi_dir: firmware/ext/rusefi
          meta_info: firmware/board/meta-info.env
          meta_output: firmware/generated/
          sim_output: firmware/generated/
          push: 'false'
          uploads: ''
          artifacts: bin hex dfu map elf srec bootloader bundle

      - name: Check the images (vector tables, OpenBLT CRC header, merged DFU layout)
        run: |
          F=firmware/ext/rusefi/firmware
          set +e
          { ls -l $F/bootloader/blbuild/*.bin $F/build/*.bin $F/deliver/ 2>&1
            python3 firmware/tools/check_image.py $F/bootloader/blbuild/openblt_miata-ecu.bin $F/build/rusefi_crc32.bin $F/deliver/rusefi.bin 2>&1
            echo "exit=$?"; } > /tmp/img.txt
          cat /tmp/img.txt
          # put the result in an annotation, which is readable from the run summary without the full log
          LEVEL=notice; grep -q '^exit=0$' /tmp/img.txt || LEVEL=error
          echo "::$LEVEL title=Image check::$(sed -e 's/%/%25/g' -e 's/\r//g' /tmp/img.txt | awk '{printf "%s%%0A", $0}')"
          grep -q '^exit=0$' /tmp/img.txt

      - name: Upload TunerStudio .ini
        uses: actions/upload-artifact@v4
        with:
          name: rusefi_miata-ecu.ini
          path: firmware/generated/tunerstudio/generated/*.ini

      # On failure, re-run the build and put its error lines in an annotation, so they show on the run's summary
      # page (and through the API) without opening the full log.
      - name: Report build errors
        if: failure()
        working-directory: firmware/ext/rusefi/firmware
        run: |
          META="${BOARD_META_PATH:-../../../board/meta-info.env}"
          bash bin/compile.sh "$META" > /tmp/retry.log 2>&1 || true
          { grep -n -E "error|Error|Exception|FAILED|No such file|not found|Unexpected" /tmp/retry.log \
              | grep -v -E "error_handling|error_accumulator|-Werror|pragma message" | head -n 40
            echo "--- last lines ---"; tail -n 25 /tmp/retry.log; } > /tmp/err.txt
          cat /tmp/err.txt
          echo "::error title=Firmware build errors::$(sed -e 's/%/%25/g' -e 's/\r//g' /tmp/err.txt | awk '{printf "%s%%0A", $0}')"

  # Verification: the board's real configuration code running inside rusEFI's engine simulator (all five years,
  # real NA/NB trigger captures), the end-to-end harness check, the wideband flasher against an AN3155 bootloader
  # model, the main-MCU image checks, and the circuit simulations. See firmware/VERIFICATION.md.
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Tools and rusEFI submodules
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ngspice stm32flash gcc-arm-none-eabi
          python3 -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          cd firmware/ext/rusefi && misc/git_scripts/common_submodule_init.sh

      - name: Engine simulation (rusEFI unit tests + this board's tests)
        working-directory: firmware/ext/rusefi/unit_tests
        env:
          BOARD_DIR: ../../../board
        run: |
          # rusEFI's committed f407 configuration headers are enough here; skip its Java code generation
          make -j4 -o .tooljars-sentinel -o .config-sentinel -o .docsenums-sentinel -o .ramdisk-sentinel
          build/rusefi_test --gtest_filter='Miata*' | tee "$GITHUB_WORKSPACE/miata_sim.txt"
          test ${PIPESTATUS[0]} -eq 0

      - name: End-to-end harness check (firmware function -> harness cavity)
        run: python3 firmware/tools/sim_report.py miata_sim.txt

      - name: Wideband flasher against the AN3155 bootloader model
        run: bash firmware/tools/flash_sim/run_flash_sim.sh firmware/ext/rusefi /tmp/flash_sim

      - name: Circuit simulations (informational)
        run: python3 firmware/tools/circuit_sim.py /tmp/spice

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results
          path: miata_sim.txt
