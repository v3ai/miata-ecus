# The website, singularityboards.com: built from website/ (the Mono theme rendered without a store) and viewer/ by
# website/site/build.sh, and published with GitHub Pages on every push to main that touches them.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'viewer/**', '.github/workflows/pages.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the site
        run: |
          npm i --prefix "$RUNNER_TEMP/liq" --no-audit --no-fund liquidjs@10.30.0
          NODE_PATH="$RUNNER_TEMP/liq/node_modules" bash website/site/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
